[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bioartifact"
version = "0.1.1"
description = "Lightweight, agent-friendly inspection and contract validation for bioinformatics artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Junhao Qiu" }
]
keywords = [
  "bioinformatics",
  "validation",
  "workflow",
  "artifacts",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
bio = [
  "pysam>=0.22",
]
tables = [
  "pandas>=2.0",
]
manifest = [
  "PyYAML>=6.0",
]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
bioartifact = "bioartifact.cli.main:main"

[project.urls]
Homepage = "https://qchiujunhao.github.io/bioartifact/"
Documentation = "https://qchiujunhao.github.io/bioartifact/"
Issues = "https://github.com/qchiujunhao/bioartifact/issues"
Source = "https://github.com/qchiujunhao/bioartifact"

[tool.hatch.build.targets.wheel]
packages = ["src/bioartifact"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/design.md",
  "/DESIGN.md",
  "/to-do.md",
  "/TODO.md",
  "/.ruff_cache",
  "/.pytest_cache",
  "/.venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
